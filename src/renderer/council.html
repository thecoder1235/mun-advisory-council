<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<title>MUN Advisory Council</title>
<style>
  :root {
    --bg:#0d0d10; --panel:#16161c; --panel2:#1b1b22; --border:#2a2a34;
    --text:#e6e6ea; --muted:#9a9aa6; --accent:#76b900;
    --danger:#ff6b6b; --ok:#4ade80; --warn:#f5c451;
    --comics:#c084fc; --film:#38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  section { margin-bottom: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  button {
    padding: 9px 15px; border-radius: 6px; border: 1px solid var(--border);
    background: #1e1e26; color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #3d3d4a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d0d10; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: 4px 9px; font-size: 12px; }
  button.link { background: none; border: none; color: var(--accent); padding: 0; }

  input, textarea, select {
    background: #0f0f14; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 14px; padding: 10px 11px; width: 100%;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 74px; font-family: inherit; }

  .row { display: flex; gap: 8px; align-items: center; }

  /* Character panel */
  .chars { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .char {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; min-width: 220px;
  }
  .char .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .char .name button { margin-left: auto; }
  .src { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 6px; align-items: baseline; }
  .src .ok { color: var(--ok); }
  .src .no { color: var(--warn); }
  .src .er { color: var(--danger); }
  .alts { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .alts select { padding: 4px 6px; font-size: 11px; margin-top: 3px; }

  .tag {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    padding: 1px 6px; border-radius: 3px; border: 1px solid;
  }
  .tag.comics { color: var(--comics); border-color: #5b3f7a; background: #241a33; }
  .tag.film   { color: var(--film);   border-color: #1e4a63; background: #10222e; }
  .tag.unver  { color: #0d0d10; border-color: var(--warn); background: var(--warn); }

  /* Headline */
  #headline {
    background: linear-gradient(180deg, #1a2110, var(--panel));
    border: 1px solid #3a4a1e; border-radius: 10px; padding: 18px 20px;
  }
  #headline h3 { margin: 0 0 10px; font-size: 15px; color: var(--accent); }

  /* Router strip */
  .router {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--muted);
  }
  .router .woke { color: var(--text); }
  .router .corr { color: var(--warn); margin-top: 6px; font-size: 12px; }
  .wake { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  /* Agent cards */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px;
    /* Each card sizes to its own content. The default (stretch) makes every
       card in a row as tall as the tallest, which both pads short cards with
       dead space and, together with the overflow rule below, cropped the long
       ones. */
    align-items: start;
  }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px;
    /* A grid item defaults to min-width:auto, so it refuses to shrink below its
       longest unbreakable word — a model id like deepseek-ai/deepseek-v4-pro-0813
       would force the column wider than the window and push the rest out of
       view on resize. */
    min-width: 0;
  }
  /* The header carries the only background that meets the card's rounded
     corners, so it rounds itself rather than the card clipping everything. */
  .card > .head {
    display: flex; align-items: center; gap: 8px; padding: 11px 13px;
    cursor: pointer; user-select: none; background: var(--panel2);
    border-radius: 8px 8px 0 0;
  }
  .card > .head:hover { background: #20202a; }
  .card .agent { font-weight: 600; font-size: 14px; }
  .card .chev { margin-left: auto; color: var(--muted); font-size: 12px; }
  .card .body { padding: 12px 14px; border-top: 1px solid var(--border); }
  /* Long model ids and URLs wrap instead of widening the column. */
  .card .body, .card .breaks { overflow-wrap: break-word; }
  .card .breaks { padding: 11px 13px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); }
  .card .breaks strong { color: var(--warn); display: block; margin-bottom: 3px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em; }
  .card.working .agent::after { content: " · working…"; color: var(--muted); font-weight: 400; font-size: 12px; }
  .card.failed { border-color: #5a2b2b; }
  .sec { margin-bottom: 12px; }
  .sec:last-child { margin-bottom: 0; }
  .sec h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase;
            letter-spacing: .05em; color: var(--muted); }
  .sec p { margin: 0 0 6px; }
  .sec ul { margin: 0 0 6px; padding-left: 18px; }

  .gaps { font-size: 12px; color: var(--muted); }
  .gaps li { margin-bottom: 3px; }

  .status { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 8px; }
  .status.err { color: var(--danger); }
  .spinner {
    display: inline-block; width: 11px; height: 11px; margin-right: 7px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .warmth { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .warmth .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .warmth.warm .dot { background: var(--ok); }
  .warmth.warming .dot { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .warmth.failed .dot { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  .card .elapsed { font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 400; }
  .card.working .head { background: #1e2216; }

  /* Timing expectation, so an 8-minute wait is never a surprise. */
  .timing-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .timing-note.first-run {
    border: 1px solid #4a3a1e; background: #241d10; color: #f0d9a0;
    border-radius: 8px; padding: 10px 12px; margin-top: 12px;
  }

  /* Per-stage progress. The council runs in three sequential stages and the
     middle one is the long pole, so showing which stage is live — and which
     agents are still in flight inside it — is what makes the wait legible. */
  .progress {
    margin-top: 14px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .stage { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 13px; }
  .stage + .stage { border-top: 1px solid #22222b; }
  .stage .mark { width: 14px; flex-shrink: 0; text-align: center; }
  .stage .label { min-width: 108px; color: var(--muted); }
  .stage .detail { flex: 1; color: var(--text); }
  .stage .secs { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage.pending { opacity: .45; }
  .stage.pending .detail { color: var(--muted); }
  .stage.running .mark { color: var(--warn); }
  .stage.done .mark { color: var(--ok); }
  .progress .total {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  .examples { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .examples button { background: none; border: none; color: var(--accent);
    padding: 0; cursor: pointer; font: inherit; font-size: 13px; display: block; margin: 3px 0; text-align: left; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 0; max-width: 620px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog .dhead { padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; }
  dialog .dbody { padding: 16px 18px; max-height: 60vh; overflow-y: auto; }
  dialog h3 { margin: 0; font-size: 15px; }
  .hist { border-bottom: 1px solid var(--border); padding: 9px 0; cursor: pointer; }
  .hist:hover { color: var(--accent); }
  .hist .q { font-size: 14px; }
  .hist .m { font-size: 12px; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>MUN Advisory Council</h1>
  <span id="warmth" class="warmth" title="Model readiness"></span>
  <span class="spacer"></span>
  <button class="small" id="btn-history">History</button>
  <button class="small" id="btn-settings">Settings</button>
</header>

<main>
<div class="wrap">

  <section>
    <h2>Characters at the table</h2>
    <div class="chars" id="chars"></div>
    <div class="row">
      <input id="char-input" placeholder="Add a character by name, e.g. Doctor Doom" />
      <button id="char-add">Add</button>
    </div>
    <div class="status" id="char-status"></div>
  </section>

  <section>
    <h2>Question</h2>
    <textarea id="question" placeholder="Which of my weaknesses can be exploited at this table, and how?"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="ask">Ask the council</button>
      <span class="status" id="ask-status" style="margin-top:0"></span>
    </div>
    <div id="timing-note" class="timing-note"></div>

    <div id="progress" class="progress" hidden></div>
    <div class="examples" id="examples">
      <div>Try:</div>
      <button data-q="Which of my weaknesses can be exploited at this table, and how?">Which of my weaknesses can be exploited at this table, and how?</button>
      <button data-q="A new delegate just joined playing Thanos. What changes for me?">A new delegate just joined playing Thanos. What changes for me?</button>
      <button data-q="Who should I court for a coalition, and what would it cost me?">Who should I court for a coalition, and what would it cost me?</button>
    </div>
  </section>

  <section id="router-section" hidden>
    <h2>Council</h2>
    <div class="router" id="router"></div>
  </section>

  <section id="headline-section" hidden>
    <h2>Headline answer</h2>
    <div id="headline"></div>
  </section>

  <section id="cards-section" hidden>
    <h2>Agent cards</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section id="gaps-section" hidden>
    <h2>Source gaps</h2>
    <ul class="gaps" id="gaps"></ul>
  </section>

</div>
</main>

<dialog id="history-dialog">
  <div class="dhead"><h3>Earlier questions</h3><span style="flex:1"></span><button class="small" id="hist-close">Close</button></div>
  <div class="dbody" id="hist-body"></div>
</dialog>

<dialog id="guide-dialog">
  <div class="dhead"><h3>User guide</h3><span style="flex:1"></span><button class="small" id="guide-close">Close</button></div>
  <div class="dbody"><pre id="guide-body"></pre></div>
</dialog>

<script src="council.js"></script>
</body>
</html>
